l_english:
 tge_dwarven_forgecraft: "Dwarven Forgecraft"
 desc_tge_dwarven_forgecraft: "Dwarves make up most of this province. Their mines, forges and foundries draw on craft knowledge kept in the holds for generations."
 tge_gnomish_tinkering: "Gnomish Tinkering"
 desc_tge_gnomish_tinkering: "Gnomes make up most of this province. Their tinkerers improve every lens grinder, boiler and building plan they get their hands on."
 tge_halfling_hearthcraft: "Halfling Hearthcraft"
 desc_tge_halfling_hearthcraft: "Halflings make up most of this province. Full cellars and well-kept fields keep everyone fed, and the land recovers quickly from hard times."
 tge_elven_artisanry: "Elven Artisanry"
 desc_tge_elven_artisanry: "Elves make up most of this province. Their artisans work on a timescale no one else can match, and it shows in everything they make and build."
 tge_kobold_tunnelling: "Kobold Tunnelling"
 desc_tge_kobold_tunnelling: "Kobolds make up most of this province. Their warrens are riddled with tunnels and traps, and every invader pays for each step."
 tge_goblin_sapperwork: "Goblin Sapperwork"
 desc_tge_goblin_sapperwork: "Goblins make up most of this province. There are always more hands for the powder works, and the ground is full of ambushes for anyone marching through."
 tge_dwarven_forgecraft_minority: "Dwarven Forgecraft (Minority)"
 desc_tge_dwarven_forgecraft_minority: "A sizeable dwarven minority lives in this province. Its smiths and miners bring some of the craft knowledge of the holds to local works."
 tge_gnomish_tinkering_minority: "Gnomish Tinkering (Minority)"
 desc_tge_gnomish_tinkering_minority: "A sizeable gnomish minority lives in this province. Its tinkerers cannot resist improving the local machinery now and then."
 tge_halfling_hearthcraft_minority: "Halfling Hearthcraft (Minority)"
 desc_tge_halfling_hearthcraft_minority: "A sizeable halfling minority lives in this province. Its farmers and cooks help keep the larders full and tempers calm."
 tge_elven_artisanry_minority: "Elven Artisanry (Minority)"
 desc_tge_elven_artisanry_minority: "A sizeable elven minority lives in this province. Its artisans lend their patience and skill to local workshops and building works."
 tge_kobold_tunnelling_minority: "Kobold Tunnelling (Minority)"
 desc_tge_kobold_tunnelling_minority: "A sizeable kobold minority lives in this province. Its warrens and traps make any invader's stay a little more costly."
 tge_goblin_sapperwork_minority: "Goblin Sapperwork (Minority)"
 desc_tge_goblin_sapperwork_minority: "A sizeable goblin minority lives in this province. It provides extra hands for the powder works and a few nasty surprises for marching armies."
