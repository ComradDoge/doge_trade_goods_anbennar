 building_mine: "Mine"
 building_mine_desc: "Requires Terrain: Hills, Highlands or Mountains\n\nChance to fail: §Y80.00%§!\nChance to success: §Y20.00%§!\n\nOn success:\n -Copper: §O35.00%§!\n -Tin/Zinc: §O30.00%§!\n -Iron: §O20.00%§!\n -Lead: §O10.00%§!\n -Gold/Silver: §O5.00%§!\n\nIf the search and operations fail we might require to use our local resources.\n\n§Y-Only one mining operation may be run at a time.§!\n§Y-You cannot build mines if you are a subject.§!\n\n§TRacial Bonus:§!\nA §Ymajority§! of the race that is not §Roppressed§! gives the full bonus, a §Yminority§! that is not §Roppressed§! gives half.\n-§YDwarves§!: prospecting starts at §G40%§! success (§G30%§! for a minority)\n-§YKobolds§!: prospecting starts at §G30%§! success (§G25%§! for a minority)\n"

